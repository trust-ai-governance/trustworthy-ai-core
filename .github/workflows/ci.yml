# CI — trustworthy-ai-core 仓库
#
# 改编自 platform 仓 CI。差异：
#  - 移除 ir-spec 短期 token / git insteadOf 步骤：core 的 WAL 工具自包含、
#    零第三方依赖、不依赖生成的 proto，因此无需拉取 spec 仓。
#  - 保留协议铁律的 license / 漏洞双扫描（宪法第 1 章），即便当前无第三方依赖
#    也常驻，未来引入依赖时立即生效。
#  - 覆盖率门槛沿用 60%（宪法 13.3）。

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # 🔴 full history so the changed-lines gates (disclosure §7B, corpus rule-2)
          # can diff against the base branch — a shallow clone has no base ref to compare.

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Generate a short-lived token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: olvandeng
          repositories: trustworthy-ai-ir-spec

      - name: Configure git to use token instead of SSH
        run: |
          git config --global url."https://x-access-token:${{ steps.generate_token.outputs.token }}@github.com/".insteadOf "ssh://git@github.com/"


      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          # Deterministic gate tools (ruff/mypy/bandit/pytest) are PINNED in
          # requirements-dev.txt — installed below, not here, so CI and a local
          # `pip install -r requirements-dev.txt` run the identical gate.
          # Only the advisory scanners float (freshness is their whole point).
          pip install pip-audit pip-licenses
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements-web.txt ]; then pip install -r requirements-web.txt; fi
          if [ -f requirements-eval.txt ]; then pip install -r requirements-eval.txt; fi

      # The EV-W2 headless render guard needs node + jsdom. Without this, node is absent on
      # CI and the guard SKIPS — protecting the one surface it exists to protect nowhere.
      # GitHub sets CI=true, so with the deps present the guard now RUNS, and if any of
      # node/jsdom/treval[web] goes missing it FAILS loudly instead of skipping (CI-1).
      - name: Set up Node.js (EV-W2 render guard)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node deps (jsdom)
        run: npm ci

      - name: Detect Python sources
        id: detect
        run: |
          if find . -name '*.py' -not -path './.*' | grep -q .; then
            echo "has_py=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_py=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Python sources yet. Code checks skipped."
          fi

      - name: Lint with Ruff
        if: steps.detect.outputs.has_py == 'true'
        run: ruff check .

      - name: Check formatting with Ruff
        if: steps.detect.outputs.has_py == 'true'
        run: ruff format --check .

      - name: Type check with mypy
        if: steps.detect.outputs.has_py == 'true'
        run: mypy tools treval

      - name: Test with pytest
        if: steps.detect.outputs.has_py == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ -d tests ] || find . -name 'test_*.py' -not -path './.*' | grep -q .; then
            pytest tests/ --cov=tools --cov=treval --cov-report=xml --cov-report=term-missing --cov-fail-under=60
          else
            echo "::notice::No tests yet. pytest skipped."
          fi

      - name: Security scan with Bandit
        if: steps.detect.outputs.has_py == 'true'
        run: bandit -r tools treval

      # This repo is public; our work is not. Four times private material reached (or
      # nearly reached) a public file, and the fourth time a human review missed two of
      # the files. See docs/DISCLOSURE_POLICY.md for the categories and the rewrite table.
      - name: Disclosure gate (public-repo docs)
        run: python tools/check_doc_disclosure.py

      # Raising injection n without raising COVERAGE (the same technique written N times) makes the
      # number less trustworthy, not more. This gate refuses it (EV-COVERAGE §2.1). The structural
      # rules (1/1b/3) always run; the new-coverage rule (2) compares added cases against a baseline
      # — pass --base origin/main in branch CI to police a whole branch (defaults to HEAD).
      - name: Corpus coverage gate
        if: steps.detect.outputs.has_py == 'true'
        env:
          # 🔴 REQUIRED: this gate imports `treval` (it reads CorpusCase); CI installs only
          # requirements, never `pip install -e .`, so without PYTHONPATH it dies at IMPORT — a
          # gate that reds the build having evaluated NOTHING (the worst gate state: looks wired,
          # never ran; same family as CI-1's skip-not-fail). Match the pytest step exactly.
          PYTHONPATH: ${{ github.workspace }}
        run: python tools/check_corpus_coverage.py

      # `corpus/` is a PUBLIC repo, so `git push` IS redistribution: the first external attack set
      # copied in triggers a third-party attribution obligation immediately (EV-COVERAGE-E3 §10.2).
      # This gate holds corpus/NOTICE and the corpus BIDIRECTIONALLY consistent (a source used but
      # un-attributed, or attributed but unused, reds), pins every probe-tool source (version/probe/
      # export-date), and reds a PLACEHOLDER commit (查有意义不只查存在). Green day-one (all cases are
      # core-authored); bites when the first external source arrives.
      - name: Corpus NOTICE attribution gate
        if: steps.detect.outputs.has_py == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}  # 🔴 imports treval — same reason as the corpus gate
        run: python tools/check_corpus_notice.py

      # Every judgment threshold must be registered with a real code home (GATE-CONSISTENCY 件二) —
      # two incidents came from a threshold living only in prose / two concepts sharing a number.
      - name: Threshold registry gate
        if: steps.detect.outputs.has_py == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}  # 🔴 imports treval — same reason as the corpus gate
        run: python tools/check_thresholds.py

      # Response content must never reach an auto-produced artifact (GATE-EGRESS 件一): a sentinel
      # rides the full pipeline as user-prompt content and must appear in ZERO products.
      - name: Content egress gate
        if: steps.detect.outputs.has_py == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}  # 🔴 imports treval — same reason as the corpus gate
        run: python tools/check_egress.py

      # E3F 3b — canary hygiene: no LITERAL canary left in the corpus (F7 requires the {{canary}}
      # placeholder), and the injection attack↔benign canary carrier rates stay within 20pp (§6.2-3).
      - name: Canary hygiene gate
        if: steps.detect.outputs.has_py == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}  # 🔴 imports treval — same reason as the corpus gate
        run: python tools/check_canary.py

      # EV-BENIGN-N173 §4 — three benign-corpus gates: difficulty ratio (≥86.4% hard, no interval-gaming
      # via easy padding), existing-immutable (the pre-N173 110 are add-only, snapshot in
      # tools/benign_baseline_n110.json), and pre-registration integrity (a predicted mis-block stays
      # counted). PASS prints the hard/easy split + both manifest tallies (§8.5.1).
      - name: Benign corpus gates
        if: steps.detect.outputs.has_py == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}  # 🔴 imports treval — same reason as the corpus gate
        run: python tools/check_benign.py

      # E3F F8 (§7B) — a measured VALUE must not be written into new prose (docs / registry / source
      # comments). Runs ONLY on lines added vs the base branch; corpus/ & tests/fixtures/ are exempt.
      - name: Disclosure-of-measured-values gate
        if: steps.detect.outputs.has_py == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          BASE=$(git merge-base HEAD "origin/${{ github.base_ref || 'main' }}" 2>/dev/null || echo HEAD)
          python tools/check_disclosure.py --base "$BASE"

      - name: Vulnerability scan with pip-audit
        run: pip-audit || true

      - name: License compliance check
        run: |
          FORBIDDEN="GPL|LGPL|AGPL|SSPL|GNU GENERAL PUBLIC|GNU LESSER|GNU AFFERO|SERVER SIDE PUBLIC"
          echo "Installed packages and licenses:"
          pip-licenses --format=plain --with-system
          pip-licenses --format=json --with-system > licenses.json
          VIOLATIONS=$(python - <<'EOF'
          import json, re
          forbidden = re.compile(r"GPL|LGPL|AGPL|SSPL|GNU GENERAL PUBLIC|GNU LESSER|GNU AFFERO|SERVER SIDE PUBLIC", re.I)
          self_pkg = re.compile(r"trustworthy-ai", re.I)
          bad = []
          for pkg in json.load(open("licenses.json")):
              if self_pkg.search(pkg.get("Name", "")):
                  continue
              if forbidden.search(pkg.get("License", "")):
                  bad.append(f"{pkg.get('Name','')}: {pkg.get('License','')}")
          if bad:
              print("\n".join(bad))
          EOF
          )
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Forbidden copyleft license detected (charter ch.1):"
            echo "$VIOLATIONS"
            exit 1
          else
            echo "License compliance check passed."
          fi
          
  ci-success:
    needs: [build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Gate on the whole build matrix
        run: |
          [ "${{ needs.build.result }}" = "success" ] || { echo "build matrix failed"; exit 1; }
