# Ruff configuration — GATE-LASTMILE P2 (RUFF-SELECT).
#
# WHY this file exists: pinning the ruff VERSION (requirements-dev.txt) only fixes
# "which ruff"; it does NOT fix "which rules". Without an explicit `select`, the gate
# lints whatever set that ruff version happens to default to — so a routine `ruff`
# upgrade can pull new rules into the default set and turn the gate red with ZERO code
# changes (this already happened once: ~80 new errors on an untouched tree). A
# deterministic gate needs BOTH pinned: the version AND the rule set.
#
# This commit only FREEZES TODAY'S EFFECTIVE SET — no behavior change, no code change.
# `["E4","E7","E9","F"]` is exactly ruff's current default here (verified: `ruff check .`
# and `ruff format --check .` produce byte-identical output before and after this file).
# Adopting NEW rules (RUF022 et al.) is a SEPARATE, reviewable increment — deliberately
# not bundled here so an "upgrade" diff never hides a "changed 80 lines" diff.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Pytest — the ONE place warning filters live.
#
# WHY global (not per-module): Starlette's TestClient emits a forward-deprecation
# ("Using `httpx` with `starlette.testclient` is deprecated; install httpx2 instead")
# the moment `fastapi.testclient` is imported — upstream, not actionable here. A
# per-module `pytest.mark.filterwarnings` can't silence it, because markers apply during
# the test CALL while the trigger is a module-top-level import at COLLECTION time
# (tests/test_cases_app.py). An ini filter covers both phases everywhere, so this one
# entry replaces the three copies that used to drift across the web-test modules.
[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
